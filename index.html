<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBTI 性格类型测试</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .container {
    background: rgba(255,255,255,0.95);
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    max-width: 700px;
    width: 100%;
    padding: 40px;
    position: relative;
    backdrop-filter: blur(10px);
  }

  /* Progress */
  .progress-bar {
    width: 100%;
    height: 6px;
    background: #e0e0e0;
    border-radius: 3px;
    margin-bottom: 30px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #667eea, #764ba2);
    border-radius: 3px;
    transition: width 0.5s ease;
    width: 0%;
  }

  /* Welcome Screen */
  .screen { display: none; }
  .screen.active { display: block; }

  .welcome-icon {
    text-align: center;
    font-size: 72px;
    margin-bottom: 20px;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .welcome h1 {
    text-align: center;
    font-size: 32px;
    color: #333;
    margin-bottom: 8px;
  }
  .welcome .subtitle {
    text-align: center;
    color: #888;
    font-size: 16px;
    margin-bottom: 30px;
  }
  .welcome .desc {
    text-align: center;
    color: #666;
    line-height: 1.8;
    margin-bottom: 30px;
    font-size: 15px;
  }
  .welcome .dimensions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 30px;
  }
  .dim-card {
    background: #f5f7ff;
    border-radius: 12px;
    padding: 16px;
    text-align: center;
  }
  .dim-card .label {
    font-size: 13px;
    color: #888;
    margin-bottom: 4px;
  }
  .dim-card .pairs {
    font-size: 18px;
    font-weight: 700;
    color: #667eea;
    letter-spacing: 4px;
  }

  /* Buttons */
  .btn {
    display: inline-block;
    padding: 14px 40px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    width: 100%;
    text-align: center;
  }
  .btn-primary {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(102,126,234,0.4);
  }
  .btn-secondary {
    background: #f0f0f0;
    color: #666;
  }
  .btn-secondary:hover {
    background: #e0e0e0;
  }

  /* Question Screen */
  .question-number {
    text-align: center;
    color: #999;
    font-size: 14px;
    margin-bottom: 6px;
  }
  .question-text {
    text-align: center;
    font-size: 20px;
    font-weight: 600;
    color: #333;
    margin-bottom: 30px;
    line-height: 1.6;
    min-height: 80px;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 24px;
  }
  .option {
    display: flex;
    align-items: center;
    padding: 14px 18px;
    border: 2px solid #e8e8e8;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .option:hover {
    border-color: #667eea;
    background: #f5f7ff;
  }
  .option.selected {
    border-color: #667eea;
    background: #eef0ff;
  }
  .option input { display: none; }
  .option .option-label {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid #ccc;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    color: #999;
    margin-right: 14px;
    flex-shrink: 0;
  }
  .option.selected .option-label {
    background: #667eea;
    border-color: #667eea;
    color: white;
  }
  .option .option-text {
    font-size: 15px;
    color: #444;
  }

  .nav-buttons {
    display: flex;
    gap: 12px;
  }
  .nav-buttons .btn { width: auto; flex: 1; }

  /* Result Screen */
  .result-type {
    text-align: center;
    margin-bottom: 24px;
  }
  .result-badge {
    display: inline-block;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    font-size: 48px;
    font-weight: 800;
    letter-spacing: 8px;
    padding: 16px 32px;
    border-radius: 16px;
    margin-bottom: 8px;
  }
  .result-title {
    font-size: 24px;
    font-weight: 700;
    color: #333;
    margin-bottom: 4px;
  }
  .result-subtitle {
    font-size: 16px;
    color: #888;
  }
  .result-description {
    background: #f5f7ff;
    border-radius: 12px;
    padding: 20px;
    line-height: 1.8;
    color: #555;
    font-size: 15px;
    margin-bottom: 20px;
  }
  .dimension-scores {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 24px;
  }
  .dim-score {
    background: #f9f9f9;
    border-radius: 12px;
    padding: 14px;
  }
  .dim-score .dim-name {
    font-size: 13px;
    color: #888;
    margin-bottom: 6px;
    text-align: center;
  }
  .dim-score .dim-bar {
    height: 8px;
    background: #e8e8e8;
    border-radius: 4px;
    overflow: hidden;
    position: relative;
    margin-bottom: 4px;
  }
  .dim-score .dim-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #667eea, #764ba2);
    border-radius: 4px;
    transition: width 1s ease;
  }
  .dim-bar-labels {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #999;
  }
  .dim-bar-labels .active {
    color: #667eea;
    font-weight: 700;
  }
  .dim-detail {
    text-align: center;
    font-size: 13px;
    color: #666;
    margin-top: 4px;
  }

  .result-actions {
    display: flex;
    gap: 12px;
  }
  .result-actions .btn { flex: 1; }

  .type-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 24px;
  }
  .type-item {
    text-align: center;
    padding: 8px 4px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    color: #ccc;
    cursor: pointer;
    transition: all 0.2s;
    background: #f5f5f5;
  }
  .type-item.active-type {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    transform: scale(1.05);
  }

  @media (max-width: 600px) {
    .container { padding: 24px; }
    .welcome-icon { font-size: 56px; }
    .welcome h1 { font-size: 24px; }
    .welcome .dimensions { grid-template-columns: 1fr; }
    .dimension-scores { grid-template-columns: 1fr; }
    .result-badge { font-size: 36px; letter-spacing: 4px; padding: 12px 24px; }
    .type-grid { grid-template-columns: repeat(4, 1fr); gap: 4px; }
    .type-item { font-size: 11px; padding: 6px 2px; }
    .question-text { font-size: 17px; }
    .nav-buttons { flex-direction: column; }
    .result-actions { flex-direction: column; }
  }
</style>
</head>
<body>

<div class="container" id="app">
  <!-- Progress Bar -->
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <!-- ============ Welcome Screen ============ -->
  <div class="screen welcome active" id="screenWelcome">
    <div class="welcome-icon">🧠</div>
    <h1>MBTI 性格类型测试</h1>
    <p class="subtitle">发现你的性格密码</p>
    <p class="desc">
      欢迎参加 MBTI 性格类型测试！本测试将通过 <strong>24 道题目</strong>，从四个维度评估你的性格倾向。<br>
      请根据你的真实感受作答，没有对错之分。
    </p>
    <div class="dimensions">
      <div class="dim-card">
        <div class="label">能量来源</div>
        <div class="pairs">E · I</div>
        <div style="font-size:12px;color:#aaa;margin-top:4px">外向 · 内向</div>
      </div>
      <div class="dim-card">
        <div class="label">认知方式</div>
        <div class="pairs">S · N</div>
        <div style="font-size:12px;color:#aaa;margin-top:4px">实感 · 直觉</div>
      </div>
      <div class="dim-card">
        <div class="label">决策方式</div>
        <div class="pairs">T · F</div>
        <div style="font-size:12px;color:#aaa;margin-top:4px">思考 · 情感</div>
      </div>
      <div class="dim-card">
        <div class="label">生活态度</div>
        <div class="pairs">J · P</div>
        <div style="font-size:12px;color:#aaa;margin-top:4px">判断 · 感知</div>
      </div>
    </div>
    <button class="btn btn-primary" onclick="startTest()">开始测试 →</button>
  </div>

  <!-- ============ Question Screen ============ -->
  <div class="screen" id="screenQuestion">
    <div class="question-number" id="questionNumber"></div>
    <div class="question-text" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="nav-buttons">
      <button class="btn btn-secondary" id="prevBtn" onclick="prevQuestion()">← 上一题</button>
      <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()">下一题 →</button>
    </div>
  </div>

  <!-- ============ Result Screen ============ -->
  <div class="screen" id="screenResult">
    <div class="result-type">
      <div class="result-badge" id="resultBadge">INTJ</div>
      <div class="result-title" id="resultTitle">建筑师</div>
      <div class="result-subtitle" id="resultSubtitle">富有想象力和战略性的思想家</div>
    </div>

    <div class="type-grid" id="typeGrid"></div>

    <div class="result-description" id="resultDescription"></div>

    <div class="dimension-scores" id="dimensionScores"></div>

    <div class="result-actions">
      <button class="btn btn-secondary" onclick="restartTest()">重新测试</button>
      <button class="btn btn-primary" onclick="shareResult()">分享结果</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// Questions (24 questions, 6 per dimension)
// ============================================================
const questions = [
  // E/I - Energy
  { q: "在社交聚会上，我喜欢主动与陌生人交谈。", dim: 'EI', dir: 1 },
  { q: "独处一段时间后，我感到精力充沛。", dim: 'EI', dir: -1 },
  { q: "我更喜欢和一两个人深度交流，而非一大群人热络交往。", dim: 'EI', dir: -1 },
  { q: "在团队中，我通常是那个主动发言的人。", dim: 'EI', dir: 1 },
  { q: "长时间的社交活动会让我感到疲惫。", dim: 'EI', dir: -1 },
  { q: "我享受成为众人关注的焦点。", dim: 'EI', dir: 1 },

  // S/N - Sensing vs Intuition
  { q: "我更关注具体的事实和细节，而非抽象的概念。", dim: 'SN', dir: 1 },
  { q: "我经常沉浸在未来的想象和可能性中。", dim: 'SN', dir: -1 },
  { q: "我喜欢按照明确的步骤和方法来完成事情。", dim: 'SN', dir: 1 },
  { q: "我经常能发现事物之间隐藏的联系和模式。", dim: 'SN', dir: -1 },
  { q: "我更相信亲眼所见、亲身经历的事情。", dim: 'SN', dir: 1 },
  { q: "我喜欢思考"如果……会怎样"这类问题。", dim: 'SN', dir: -1 },

  // T/F - Thinking vs Feeling
  { q: "做决定时，我主要依靠逻辑分析而非个人感受。", dim: 'TF', dir: 1 },
  { q: "我非常在意他人的感受和需求。", dim: 'TF', dir: -1 },
  { q: "我认为说真话比顾及对方感受更重要。", dim: 'TF', dir: 1 },
  { q: "看到他人受到不公平对待，我会非常愤慨。", dim: 'TF', dir: -1 },
  { q: "即使可能伤害他人感情，我也会坚持原则。", dim: 'TF', dir: 1 },
  { q: "我很容易与他人产生情感共鸣。", dim: 'TF', dir: -1 },

  // J/P - Judging vs Perceiving
  { q: "我喜欢提前制定详细的计划。", dim: 'JP', dir: 1 },
  { q: "我享受随性和灵活的生活方式。", dim: 'JP', dir: -1 },
  { q: "杂乱无章的环境会让我感到不安。", dim: 'JP', dir: 1 },
  { q: "我倾向于保留选择权，不急于做决定。", dim: 'JP', dir: -1 },
  { q: "我习惯每天列待办清单并按计划执行。", dim: 'JP', dir: 1 },
  { q: "我能迅速适应突如其来的变化。", dim: 'JP', dir: -1 }
];

// ============================================================
// MBTI Type Data
// ============================================================
const typeData = {
  'INTJ': { title: '建筑师', sub: '富有想象力和战略性的思想家', desc: 'INTJ 是独立思考者，他们以逻辑和分析的方式看待世界。他们喜欢将想法系统化，制定长期计划，并坚定不移地追求目标。他们重视知识、能力和效率，对自己和他人都有很高的标准。虽然外表冷静理性，但内心充满对未来的远见和抱负。' },
  'INTP': { title: '逻辑学家', sub: '具有创造力的创新思考者', desc: 'INTP 是理性的分析家，他们对理论和抽象概念有着天生的好奇心。他们喜欢探索模式、联系和可能性，不断追问"为什么"。他们独立思考，重视逻辑一致性，思维灵活开放。他们享受深入探讨感兴趣的话题，对繁琐的日常事务不太在意。' },
  'ENTJ': { title: '指挥官', sub: '大胆、富有想象力且意志坚强的领导者', desc: 'ENTJ 是天生的领导者，他们善于制定战略、组织资源并推动执行。他们思维敏捷、果断自信，总是着眼于大局。他们喜欢挑战，擅长将长期愿景转化为具体计划。他们直接坦率，重视能力和结果，不断追求卓越。' },
  'ENTP': { title: '辩论家', sub: '聪明好奇的思想家', desc: 'ENTP 是充满创造力的辩论者，他们享受挑战现有观念和探索新想法。他们思维敏捷、善于即兴发挥，总能在不同事物之间建立联系。他们喜欢从多个角度看问题，热衷于智力交锋。他们适应力强，总是对新鲜事物充满热情。' },

  'INFJ': { title: '提倡者', sub: '安静而神秘，鼓舞人心的理想主义者', desc: 'INFJ 拥有强烈的使命感和深刻的洞察力。他们能够敏锐地感知他人的情感和需求，同时坚持自己的价值观和愿景。他们富有创造力、有原则且有同理心，致力于让世界变得更好。虽然内向安静，但有着非凡的感染力。' },
  'INFP': { title: '调停者', sub: '诗意、善良的利他主义者', desc: 'INFP 是充满热情的理想主义者，他们以强烈的价值观和深刻的同理心看待世界。他们追求真实和意义，富有创造力和想象力。他们温和敏感，总是关注他人的感受。他们忠于自己的信念，努力让世界变得更加美好和和谐。' },
  'ENFJ': { title: '主人公', sub: '富有魅力和鼓舞人心的领导者', desc: 'ENFJ 是天然的领袖，他们具有非凡的感召力和人际洞察力。他们善于发现他人的潜能，并热情地帮助他人成长。他们富有魅力、善于沟通，能够凝聚团队朝着共同目标前进。他们真诚关心他人，致力于创造积极的变化。' },
  'ENFP': { title: '竞选者', sub: '热情、有创造力且善于社交的自由精神', desc: 'ENFP 是充满热情和创造力的探索者，他们对世界充满好奇和可能性。他们善于与人建立联系，富有感染力和活力。他们重视自由和真实，追求有意义的关系和经历。他们思维跳跃、兴趣广泛，总能发现生活中的美妙之处。' },

  'ISTJ': { title: '物流师', sub: '实际且稳重，值得信赖的守护者', desc: 'ISTJ 是可靠、负责的实干家，他们以有条不紊的方式对待生活和工作。他们重视传统、规则和秩序，做事认真细致、一丝不苟。他们是社会和组织的基石，承诺的事情一定会做到。他们务实沉稳，是值得信赖的伙伴。' },
  'ISFJ': { title: '守卫者', sub: '专注而温暖，乐于奉献的守护者', desc: 'ISFJ 是温柔、负责的守护者，他们默默付出，关心他人的需求。他们注重细节、做事有条理，善于创造和谐稳定的环境。他们忠诚可靠，对承诺非常认真。虽然低调内敛，但他们的温暖和奉献精神深深影响着身边的人。' },
  'ESTJ': { title: '总经理', sub: '高效、果断，天生的管理者', desc: 'ESTJ 是务实果断的组织者，他们善于制定规则和流程，确保事情高效运转。他们重视秩序、结构和结果，有强烈的责任感。他们直接坦率、诚实可靠，是天生的管理者。他们相信传统价值，努力维护社会的稳定和秩序。' },
  'ESFJ': { title: '执政官', sub: '热情、有爱心，受欢迎的合作者', desc: 'ESFJ 是温暖热情的奉献者，他们乐于助人，重视和谐的人际关系。他们善于组织和协调，关注他人的实际需求。他们责任感强、勤奋可靠，是社区和团队的粘合剂。他们重视传统和归属感，努力让周围的人感到被关心和支持。' },

  'ISTP': { title: '鉴赏家', sub: '灵活、实际，喜欢动手探索的创造者', desc: 'ISTP 是冷静灵活的问题解决者，他们善于分析事物的运作原理并动手实践。他们独立自主、适应力强，在压力下保持冷静。他们喜欢探索新事物，追求刺激和自由。他们不善言辞，但行动力强，是天生的冒险家和工匠。' },
  'ISFP': { title: '探险家', sub: '灵活迷人，安静的艺术探索者', desc: 'ISFP 是温柔敏感的艺术家，他们用独特的审美和感官体验探索世界。他们安静内敛，但内心世界丰富而深刻。他们重视个人价值和自由，不喜欢被束缚。他们善解人意、包容开放，用自己的方式创造美和意义。' },
  'ESTP': { title: '企业家', sub: '精力充沛、善于感知的行动派', desc: 'ESTP 是充满活力的实干家，他们善于把握时机、果断行动。他们观察力敏锐，能迅速评估环境并做出反应。他们喜欢冒险和挑战，享受刺激的体验。他们魅力十足、善于交际，是天生的谈判家和企业家。' },
  'ESFP': { title: '表演者', sub: '热情外向，热爱生活的表演者', desc: 'ESFP 是充满热情和活力的表演者，他们享受成为人群中的焦点。他们乐观开朗、善于交际，总能给周围带来欢乐。他们对审美和体验有着敏锐的感受力，热爱生活中的美好事物。他们慷慨温暖，乐于分享，是派对和聚会的灵魂人物。' }
};

let currentQuestion = 0;
let answers = new Array(questions.length).fill(null);

// ============================================================
// Screen Management
// ============================================================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  // Hide progress bar on welcome screen
  document.querySelector('.progress-bar').style.opacity = id === 'screenWelcome' ? '0' : '1';
}

// ============================================================
// Start Test
// ============================================================
function startTest() {
  currentQuestion = 0;
  answers = new Array(questions.length).fill(null);
  showScreen('screenQuestion');
  renderQuestion();
}

// ============================================================
// Render Question
// ============================================================
function renderQuestion() {
  const q = questions[currentQuestion];
  document.getElementById('questionNumber').textContent = `第 ${currentQuestion + 1} / ${questions.length} 题`;
  document.getElementById('questionText').textContent = q.q;

  const labels = ['-2', '-1', '0', '+1', '+2'];
  const texts = ['非常不同意', '不同意', '中立', '同意', '非常同意'];

  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  labels.forEach((val, i) => {
    const div = document.createElement('div');
    div.className = 'option' + (answers[currentQuestion] === i ? ' selected' : '');
    div.innerHTML = `
      <div class="option-label">${val}</div>
      <div class="option-text">${texts[i]}</div>
    `;
    div.onclick = () => selectOption(i);
    container.appendChild(div);
  });

  updateProgress();
  document.getElementById('prevBtn').style.display = currentQuestion === 0 ? 'none' : 'block';
  document.getElementById('nextBtn').textContent = currentQuestion === questions.length - 1 ? '查看结果 →' : '下一题 →';
}

function selectOption(idx) {
  answers[currentQuestion] = idx;
  document.querySelectorAll('.option').forEach((el, i) => {
    el.classList.toggle('selected', i === idx);
  });
}

function nextQuestion() {
  if (answers[currentQuestion] === null) {
    // shake animation
    document.getElementById('questionText').style.animation = 'shake 0.4s ease';
    setTimeout(() => document.getElementById('questionText').style.animation = '', 500);
    return;
  }
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    renderQuestion();
  } else {
    calculateResult();
  }
}

function prevQuestion() {
  if (currentQuestion > 0) {
    currentQuestion--;
    renderQuestion();
  }
}

function updateProgress() {
  const answered = answers.filter(a => a !== null).length;
  const pct = (answered / questions.length) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
}

// ============================================================
// Calculate Result
// ============================================================
function calculateResult() {
  // Convert answers (0-4 scale) to scores: 0→-2, 1→-1, 2→0, 3→+1, 4→+2
  let scores = { EI: 0, SN: 0, TF: 0, JP: 0 };

  questions.forEach((q, i) => {
    if (answers[i] === null) return;
    let val = answers[i] - 2; // convert to -2,-1,0,+1,+2
    scores[q.dim] += val * q.dir;
  });

  // Normalize to percentage (max possible per dimension: 6 * 2 = 12)
  // Map from [-12, 12] to [0, 100], where 50 is neutral
  function toPct(score) {
    return Math.round(((score + 12) / 24) * 100);
  }

  const eiPct = toPct(scores.EI);
  const snPct = toPct(scores.SN);
  const tfPct = toPct(scores.TF);
  const jpPct = toPct(scores.JP);

  const type = (eiPct >= 50 ? 'E' : 'I') +
               (snPct >= 50 ? 'S' : 'N') +
               (tfPct >= 50 ? 'T' : 'F') +
               (jpPct >= 50 ? 'J' : 'P');

  showResult(type, { EI: eiPct, SN: snPct, TF: tfPct, JP: jpPct });
}

// ============================================================
// Show Result
// ============================================================
function showResult(type, scores) {
  const data = typeData[type] || typeData['INTJ'];
  document.getElementById('resultBadge').textContent = type;
  document.getElementById('resultTitle').textContent = data.title;
  document.getElementById('resultSubtitle').textContent = data.sub;
  document.getElementById('resultDescription').textContent = data.desc;

  // Type grid
  const grid = document.getElementById('typeGrid');
  grid.innerHTML = '';
  const allTypes = Object.keys(typeData);
  allTypes.forEach(t => {
    const div = document.createElement('div');
    div.className = 'type-item' + (t === type ? ' active-type' : '');
    div.textContent = t;
    grid.appendChild(div);
  });

  // Dimension bars
  const dims = document.getElementById('dimensionScores');
  dims.innerHTML = '';
  const dimConfig = [
    { key: 'EI', left: 'I 内向', right: 'E 外向', pct: scores.EI },
    { key: 'SN', left: 'N 直觉', right: 'S 实感', pct: scores.SN },
    { key: 'TF', left: 'F 情感', right: 'T 思考', pct: scores.TF },
    { key: 'JP', left: 'P 感知', right: 'J 判断', pct: scores.JP }
  ];

  dimConfig.forEach(d => {
    const div = document.createElement('div');
    div.className = 'dim-score';
    div.innerHTML = `
      <div class="dim-name">${d.left} ↔ ${d.right}</div>
      <div class="dim-bar">
        <div class="dim-bar-fill" style="width:${d.pct}%"></div>
      </div>
      <div class="dim-bar-labels">
        <span class="${d.pct < 50 ? 'active' : ''}">${d.left}</span>
        <span>${d.pct}%</span>
        <span class="${d.pct >= 50 ? 'active' : ''}">${d.right}</span>
      </div>
      <div class="dim-detail">${d.pct >= 50 ? d.right + '倾向' : d.left + '倾向'} · ${Math.abs(d.pct - 50)}%</div>
    `;
    dims.appendChild(div);
  });

  showScreen('screenResult');
  document.getElementById('progressFill').style.width = '100%';
}

// ============================================================
// Restart / Share
// ============================================================
function restartTest() {
  showScreen('screenWelcome');
  document.getElementById('progressFill').style.width = '0%';
}

function shareResult() {
  const type = document.getElementById('resultBadge').textContent;
  const title = document.getElementById('resultTitle').textContent;
  const text = `我的 MBTI 性格类型是 ${type}（${title}）！快来测试你的性格类型吧！`;
  if (navigator.share) {
    navigator.share({ title: 'MBTI 性格测试', text });
  } else {
    navigator.clipboard.writeText(text).then(() => {
      alert('结果已复制到剪贴板，去分享给好友吧！');
    });
  }
}

// Shake animation keyframes (add dynamically)
const style = document.createElement('style');
style.textContent = `
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    10%, 30%, 50%, 70%, 90% { transform: translateX(-6px); }
    20%, 40%, 60%, 80% { transform: translateX(6px); }
  }
`;
document.head.appendChild(style);

// Keyboard shortcuts
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    const nextBtn = document.getElementById('nextBtn');
    if (nextBtn && document.getElementById('screenQuestion').classList.contains('active')) {
      nextQuestion();
    }
  }
  if (e.key >= '1' && e.key <= '5') {
    const idx = parseInt(e.key) - 1;
    if (document.getElementById('screenQuestion').classList.contains('active') && answers[currentQuestion] === null) {
      selectOption(idx);
    }
  }
  if (e.key === 'ArrowLeft') { prevQuestion(); }
  if (e.key === 'ArrowRight') { nextQuestion(); }
});
</script>
